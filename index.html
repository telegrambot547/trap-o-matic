<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tom's Trap-O-Matic</title>
<link rel="icon" href="icon.jpg">
<script src="ruffle.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0d2b6b;
    overflow: hidden;
    font-family: Tahoma, Arial, sans-serif;
    overscroll-behavior: none;
  }

  #game-wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game-container {
    width: 800px;
    height: 480px;
    max-width: 100vw;
    max-height: 100vh;
  }

  ruffle-object, ruffle-embed {
    width: 100% !important;
    height: 100% !important;
  }

  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    gap: 16px;
    z-index: 5;
    background: #0d2b6b;
  }

  #loading img { width: 220px; max-width: 60%; }
  #loading .spinner {
    width: 36px; height: 36px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="game-wrap">
  <div id="loading" dir="rtl">
    <img src="TrapOMaticTitle.png" alt="Tom's Trap-O-Matic">
    <div class="spinner"></div>
    <div>جارِ تحميل اللعبة...</div>
  </div>
  <div id="game-container"></div>
</div>

<script>
  window.RufflePlayer = window.RufflePlayer || {};

  window.addEventListener("DOMContentLoaded", () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.id = "game-player";
    const container = document.getElementById("game-container");
    container.appendChild(player);

    player.addEventListener("loadedmetadata", () => {
      const loading = document.getElementById("loading");
      if (loading) loading.style.display = "none";
    });

    player.load({
      url: "tj_trapomatic.swf",
      autoplay: "on",
      unmuteOverlay: "visible",
      scale: "noScale",
      allowScriptAccess: false
    });

    setTimeout(() => {
      const loading = document.getElementById("loading");
      if (loading) loading.style.display = "none";
    }, 6000);
  });
</script>

</body>
</html>
